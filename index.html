<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secretaria</title>
  <style>
    :root { --bg:#0b1020; --card:rgba(18,26,49,.9); --line:rgba(255,255,255,.08); --text:#eef2ff; --muted:#9aa6c4; --indigo:#8b9cff; --indigo-dim:rgba(139,156,255,.14); --teal:#5eead4; --teal-dim:rgba(94,234,212,.12); --amber:#fbbf24; --amber-dim:rgba(251,191,36,.14); }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(900px 420px at 10% -10%,rgba(99,102,241,.28),transparent 55%),radial-gradient(700px 380px at 110% 10%,rgba(45,212,191,.16),transparent 50%),var(--bg);color:var(--text)}
    #gate{min-height:100vh;display:grid;place-items:center;padding:24px}
    #gate.hidden{display:none}
    .gate-card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px}
    .kicker{color:var(--muted);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
    .gate-card h1{margin:8px 0;font-size:22px}
    .gate-card p{margin:0 0 16px;color:var(--muted);font-size:14px}
    input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0b1020;color:var(--text);font-size:15px}
    button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#8b9cff;color:#0b1020;font-weight:700;cursor:pointer}
    .err{display:none;margin-top:10px;color:#fda4af;font-size:13px}
    #dash{display:none}
    #dash.show{display:block}
    .wrap{max-width:720px;margin:0 auto;padding:32px 20px 48px}
    .clocks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:0 0 22px}
    .clock{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;text-align:center}
    .clock .city{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .clock .hh{margin-top:8px;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
    .clock .dd{margin-top:4px;font-size:12px;color:var(--muted)}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
    h1{margin:6px 0 4px;font-size:28px;letter-spacing:-.03em}
    .date{color:var(--muted);font-size:15px}
    .chip{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted)}
    .summary{display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr;gap:12px;margin-bottom:28px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
    .label{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
    .value{margin-top:8px;font-size:18px;font-weight:650}
    .sub{margin-top:4px;color:var(--muted);font-size:13px}
    section{margin-bottom:22px}
    .proj{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .dot{width:8px;height:8px;border-radius:50%}
    .dot.indigo{background:var(--indigo);box-shadow:0 0 0 4px var(--indigo-dim)}
    .dot.teal{background:var(--teal);box-shadow:0 0 0 4px var(--teal-dim)}
    .dot.amber{background:var(--amber);box-shadow:0 0 0 4px var(--amber-dim)}
    .proj h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .event{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:16px 18px}
    .event+.event,.task+.task{border-top:1px solid var(--line)}
    .time{font-variant-numeric:tabular-nums;font-weight:650}
    .time span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .title{font-size:16px;font-weight:650}
    .meta{margin-top:6px;color:var(--muted);font-size:13px}
    .meta a{color:var(--indigo);text-decoration:none}
    .task{display:flex;gap:12px;padding:14px 18px}
    .box{width:16px;height:16px;margin-top:2px;border:1.5px solid #6e7a99;border-radius:4px;flex:0 0 16px}
    footer{margin-top:28px;color:#6e7a99;font-size:12px;text-align:center}
    @media(max-width:720px){.summary{grid-template-columns:1fr 1fr}.clock .hh{font-size:20px}}
  </style>
</head>
<body>
  <div id="gate">
    <form class="gate-card" onsubmit="return manual(event)">
      <div class="kicker">Secretaria</div>
      <h1>Desencriptar</h1>
      <p>Pasa la clave en la URL (<code>#clave</code>) o escríbela aquí.</p>
      <input id="pw" type="password" placeholder="Clave" />
      <button type="submit">Abrir</button>
      <div class="err" id="err">No se pudo desencriptar</div>
    </form>
  </div>
  <div id="dash">
    <div class="wrap" id="app"></div>
  </div>
  <template id="clocks-tpl">
    <div class="clocks">
      <div class="clock"><div class="city">Colombia</div><div class="hh" id="t-co">--:--</div><div class="dd" id="d-co"></div></div>
      <div class="clock"><div class="city">Múnich</div><div class="hh" id="t-mu">--:--</div><div class="dd" id="d-mu"></div></div>
      <div class="clock"><div class="city">Hong Kong</div><div class="hh" id="t-hk">--:--</div><div class="dd" id="d-hk"></div></div>
    </div>
  </template>

    function b64(s){return Uint8Array.from(atob(s), c => c.charCodeAt(0))}
    async function keyFrom(pw, salt){
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    }
    async function decrypt(pw){
      const key = await keyFrom(pw, b64(SALT));
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(NONCE)}, key, b64(CT));
      return new TextDecoder().decode(pt);
    }
    function tick(){
      const zones = [['t-co','d-co','America/Bogota'],['t-mu','d-mu','Europe/Berlin'],['t-hk','d-hk','Asia/Hong_Kong']];
      const now = new Date();
      for (const [tid, did, tz] of zones) {
        const el = document.getElementById(tid);
        if(!el) return;
        el.textContent = now.toLocaleTimeString('es-CO', {timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true});
        document.getElementById(did).textContent = now.toLocaleDateString('es-CO', {timeZone: tz, weekday: 'short', day: 'numeric', month: 'short'});
      }
    }
    async function openWith(pw){
      try{
        const app = document.getElementById('app');
        const raw = await decrypt(pw);
        const inner = raw.replace(/^\s*<div class="wrap">/i,'').replace(/<\/div>\s*$/i,'');
        app.innerHTML = inner;
        const header = app.querySelector('header');
        const clocks = document.getElementById('clocks-tpl').content.cloneNode(true);
        if(header) header.after(clocks); else app.prepend(clocks);
        document.getElementById('gate').classList.add('hidden');
        document.getElementById('dash').classList.add('show');
        tick();
        setInterval(tick, 15000);
        history.replaceState(null,'', location.pathname + location.search + '#' + encodeURIComponent(pw));
      }catch(e){
        document.getElementById('err').style.display='block';
      }
    }
    function manual(e){ e.preventDefault(); openWith(document.getElementById('pw').value); return false; }
    const fromUrl = decodeURIComponent((location.hash||'').replace(/^#/,'')) || new URLSearchParams(location.search).get('k');
    if(fromUrl) openWith(fromUrl);
  </script>
</body>
</html>
