<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secretaria Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --card: rgba(20, 25, 40, 0.7);
  --accent: #00d4ff;
  --accent2: #7c3aed;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --border: rgba(255,255,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(135deg, #0a0e17 0%, #111827 50%, #0f172a 100%);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1rem;
}
.container { max-width: 1200px; margin: 0 auto; }
.clocks-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  margin-bottom: 2.5rem;
}
.clock-card {
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}
.clock-card:hover { transform: translateY(-4px); }
.clock-city {
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.5rem;
}
.clock-time {
  font-size: 2.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.05em;
}
.clock-tz { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
#content-area {
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2rem;
  min-height: 400px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
}
.locked-message {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--muted);
}
.locked-message h2 { color: var(--text); margin-bottom: 1rem; }
.dashboard-content h1 {
  font-size: 2rem;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
}
.date { color: var(--muted); font-size: 1rem; margin-bottom: 0.25rem; }
.subtitle { font-size: 1.1rem; margin-bottom: 2rem; color: #fbbf24; }
.projects h2 { font-size: 1.4rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
.project-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}
.project-card.highlight { border-color: rgba(0,212,255,0.3); background: rgba(0,212,255,0.05); }
.project-card h3 { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--accent); }
.no-events { color: var(--muted); font-style: italic; }
.tasks { margin-top: 1rem; }
.tasks h4 { font-size: 0.9rem; color: #fbbf24; margin-bottom: 0.5rem; }
.tasks ul { padding-left: 1.25rem; }
.tasks li { margin-bottom: 0.35rem; }
@media (max-width: 768px) {
  .clocks-row { grid-template-columns: 1fr; }
  .clock-time { font-size: 1.8rem; }
}
</style>
</head>
<body>
<div class="container">
  <div class="clocks-row">
    <div class="clock-card">
      <div class="clock-city">Colombia</div>
      <div class="clock-time" id="colombia">--:--:--</div>
      <div class="clock-tz">America/Bogota</div>
    </div>
    <div class="clock-card">
      <div class="clock-city">Múnich</div>
      <div class="clock-time" id="munich">--:--:--</div>
      <div class="clock-tz">Europe/Berlin</div>
    </div>
    <div class="clock-card">
      <div class="clock-city">Hong Kong</div>
      <div class="clock-time" id="hongkong">--:--:--</div>
      <div class="clock-tz">Asia/Hong_Kong</div>
    </div>
  </div>
  <div id="content-area">
    <div class="locked-message">
      <h2>Contenido protegido</h2>
      <p>Accede con el enlace correcto para ver el calendario y las tareas.</p>
    </div>
  </div>
</div>

function updateClocks() {
  const now = new Date();
  const opts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
  document.getElementById('colombia').textContent = new Intl.DateTimeFormat('es-CO', { ...opts, timeZone: 'America/Bogota' }).format(now);
  document.getElementById('munich').textContent = new Intl.DateTimeFormat('de-DE', { ...opts, timeZone: 'Europe/Berlin' }).format(now);
  document.getElementById('hongkong').textContent = new Intl.DateTimeFormat('zh-HK', { ...opts, timeZone: 'Asia/Hong_Kong' }).format(now);
}
setInterval(updateClocks, 1000);
updateClocks();

function decryptAndShow() {
  const hash = window.location.hash;
  if (!hash || hash.length < 2) return;
  const key = hash.slice(1);
  try {
    const bytes = CryptoJS.AES.decrypt(ENCRYPTED, key);
    const decrypted = bytes.toString(CryptoJS.enc.Utf8);
    if (decrypted && decrypted.trim().length > 10) {
      document.getElementById('content-area').innerHTML = decrypted;
    }
  } catch (e) {
    console.error(e);
  }
}
document.addEventListener('DOMContentLoaded', decryptAndShow);
window.addEventListener('hashchange', decryptAndShow);

</body>
</html>
